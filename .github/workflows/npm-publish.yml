# 基于 GitHub 官方 "Publish Node.js Package" 模板，外加定时同步：
# - release: published → 立即发布该 Release（模板行为）
# - schedule           → 每天检查「最新 Release 的版本是否已在 npm」，缺则补发布
# - workflow_dispatch  → 手动补发布
#
# 另外把每个 Release 的 tarball 作为**release 资产**挂上（`attach-tarball` job）：
# 插件目录（awesome-dsh-plugin）的 `tarball` 字段要求形如
# `<repo>-<version>.tgz` 的 release 资产，否则该字段会 404。每天也会自愈补挂。
#
# 需要仓库 Secret：NPM_TOKEN —— granular access token，权限 Packages: Read and write，
# Scope 限定到本包，并开启 "Bypass 2FA when using this token"（否则发布会被 2FA 拦下）。
# 也支持 npm Trusted Publishing（OIDC，无需 secret）：在 npmjs.com 为本仓库+本 workflow
# 配置 Trusted Publisher 后，删除下面 Publish 步骤的 NODE_AUTH_TOKEN 即可。
name: Publish Node.js Package

on:
  release:
    types: [published]
  schedule:
    # 每天 03:17 UTC 同步一次（避开整点，减少排队）
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm provenance（发布为 --provenance 时需要）

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  build:
    name: Test
    runs-on: ubuntu-latest
    env:
      # devDependencies 含 puppeteer（仅本地 live/截图脚本用）；跳过 Chromium 下载，CI 不需要
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # 需要 devDependencies：typescript/esbuild 用于从 src/*.ts 构建 lib/*.js
      - run: npm ci --no-audit --no-fund
      - name: Typecheck the TypeScript sources
        run: npm run typecheck
      - name: Build and run the full test chain
        run: npm test
      - name: Verify the committed build output matches src
        run: |
          set -euo pipefail
          if ! git diff --exit-code -- lib; then
            echo "::error::lib/ 与 src/ 不同步：请在本地运行 npm run build 并提交产物"
            exit 1
          fi

  publish-npm:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    # Trusted Publishing（OIDC）：GitHub 现签发短期身份令牌给 npm，无需长期 token。
    # 注意：必须在 GitHub 托管的 runner 上运行，且 npm 侧要配置 Trusted Publisher。
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Resolve the latest release
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if ! tag=$(gh release view --json tagName -q .tagName 2>/dev/null); then
            echo "::notice::仓库还没有 Release，跳过"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "::notice::目标 Release: $tag"

      - uses: actions/checkout@v4
        if: steps.target.outputs.skip != 'true'
        with:
          ref: ${{ steps.target.outputs.tag }}

      - uses: actions/setup-node@v4
        if: steps.target.outputs.skip != 'true'
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Verify the tag matches package.json
        if: steps.target.outputs.skip != 'true'
        run: |
          set -euo pipefail
          manifest=$(node -p "require('./package.json').version")
          if [ "$manifest" != "${{ steps.target.outputs.version }}" ]; then
            echo "::error::Release tag ${{ steps.target.outputs.tag }} 与 package.json ($manifest) 不一致，拒绝发布"
            exit 1
          fi

      - name: Check whether this version is already on npm
        id: npmcheck
        if: steps.target.outputs.skip != 'true'
        run: |
          set -euo pipefail
          if npm view "dsh-ui-auth@${{ steps.target.outputs.version }}" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::dsh-ui-auth@${{ steps.target.outputs.version }} 已在 npm，跳过发布"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "::notice::准备发布 dsh-ui-auth@${{ steps.target.outputs.version }}"
          fi

      # 认证路径：优先 Trusted Publishing（配置后请删除 NPM_TOKEN Secret）；
      # 退路是 granular token（Packages: Read and write）。两者都不在时明确失败。
      - name: Choose the auth path
        id: auth
        if: steps.target.outputs.skip != 'true' && steps.npmcheck.outputs.published == 'false'
        env:
          TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "${TOKEN}" ]; then
            echo "::notice::检测到 NPM_TOKEN：本次用 token 发布（若已在 npm 配置 Trusted Publisher，建议删除该 Secret 改用 OIDC）"
            echo "mode=token" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::未配置 NPM_TOKEN：本次走 Trusted Publishing（OIDC）"
            echo "mode=oidc" >> "$GITHUB_OUTPUT"
          fi

      # Trusted Publishing 需要 npm >= 11.5.1（runner 自带的版本往往更旧）
      - name: Use a Trusted-Publishing-capable npm
        if: steps.target.outputs.skip != 'true' && steps.npmcheck.outputs.published == 'false'
        run: npm install -g npm@latest && npm --version

      - name: Install dependencies
        if: steps.target.outputs.skip != 'true' && steps.npmcheck.outputs.published == 'false'
        run: npm ci --no-audit --no-fund
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'

      # npm publish 会触发 prepack（= npm test）：从 src/*.ts 构建 lib/*.js 并跑完整测试链。
      # 409 表示该版本已在 npm 的**暂存区**（staged publish，需维护者 2FA 批准）：视为已发布，避免每日补发布假失败。
      - name: Publish via Trusted Publishing (OIDC)
        if: steps.target.outputs.skip != 'true' && steps.npmcheck.outputs.published == 'false' && steps.auth.outputs.mode == 'oidc'
        run: |
          set +e
          output=$(npm publish --access public --registry=https://registry.npmjs.org 2>&1); status=$?
          echo "$output"
          if [ $status -ne 0 ] && echo "$output" | grep -qE 'E409|previously staged'; then
            echo "::notice::dsh-ui-auth@${{ steps.target.outputs.version }} 已在 npm 暂存区（E409）：视为已发布，等待维护者批准"
            exit 0
          fi
          exit $status

      - name: Publish via token
        if: steps.target.outputs.skip != 'true' && steps.npmcheck.outputs.published == 'false' && steps.auth.outputs.mode == 'token'
        run: |
          set +e
          output=$(npm publish --access public --registry=https://registry.npmjs.org 2>&1); status=$?
          echo "$output"
          if [ $status -ne 0 ] && echo "$output" | grep -qE 'E409|previously staged'; then
            echo "::notice::dsh-ui-auth@${{ steps.target.outputs.version }} 已在 npm 暂存区（E409）：视为已发布，等待维护者批准"
            exit 0
          fi
          exit $status
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Report
        if: steps.target.outputs.skip != 'true' && steps.npmcheck.outputs.published == 'true'
        run: echo "::notice::dsh-ui-auth@${{ steps.target.outputs.version }} 已是最新，无需操作"

  # 插件目录用 release 资产提供「下载 tarball」入口：
  #   https://github.com/0QwQ0/dsh-ui-auth/releases/download/<tag>/dsh-ui-auth-<version>.tgz
  # 该 URL 只在资产存在时可解析（catalog 的 probe-tarballs.mjs 会定期校验，死了就从站点摘掉），
  # 所以每个 Release 都要挂上；每天也跑一次，缺了就补。
  attach-tarball:
    name: Attach release tarball
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # 上传 Release 资产
    steps:
      - name: Resolve the latest release
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if ! tag=$(gh release view --json tagName -q .tagName 2>/dev/null); then
            echo "::notice::仓库还没有 Release，跳过"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "::notice::目标 Release: $tag"

      - uses: actions/checkout@v4
        if: steps.target.outputs.skip != 'true'
        with:
          ref: ${{ steps.target.outputs.tag }}

      - uses: actions/setup-node@v4
        if: steps.target.outputs.skip != 'true'
        with:
          node-version: 24

      - name: Check whether the asset already exists
        id: asset
        if: steps.target.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          name="dsh-ui-auth-${{ steps.target.outputs.version }}.tgz"
          if gh release view "${{ steps.target.outputs.tag }}" --json assets -q '.assets[].name' | grep -Fxq "$name"; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$name 已存在，无需重复上传"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Pack the tag and upload it as a release asset
        if: steps.target.outputs.skip != 'true' && steps.asset.outputs.present == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          manifest=$(node -p "require('./package.json').version")
          if [ "$manifest" != "${{ steps.target.outputs.version }}" ]; then
            echo "::error::Release tag ${{ steps.target.outputs.tag }} 与 package.json ($manifest) 不一致，拒绝挂资产"
            exit 1
          fi
          # lib/ 是已提交的构建产物（Test job 会校验与 src/ 一致），因此这里不必再跑一次 prepack
          npm pack --ignore-scripts >/dev/null
          ls -l "dsh-ui-auth-${manifest}.tgz"
          gh release upload "${{ steps.target.outputs.tag }}" "dsh-ui-auth-${manifest}.tgz" --clobber
          echo "::notice::已把 dsh-ui-auth-${manifest}.tgz 挂到 ${{ steps.target.outputs.tag }}"
